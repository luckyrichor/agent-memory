services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agent_memory
      POSTGRES_USER: agent_memory
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "${MEMORY_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_memory -d agent_memory"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - agent-memory-postgres:/var/lib/postgresql/data

volumes:
  agent-memory-postgres:
